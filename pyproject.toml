# pyproject.toml — AgentKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md.
#
# Quick install (pip)
# -------------------
#   pip install -e "."                  core runtime only
#   pip install -e ".[llm]"             + Anthropic LLM summarizer
#   pip install -e ".[local]"           + omlx/ollama/openai summarizer backends
#   pip install -e ".[viz]"             + Streamlit/PyVis visualizer
#   pip install -e ".[llm,local,viz]"   + every feature extra
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit, pdoc
#   poetry install --with kg            + the dockg / pycodekg CLIs
#   poetry install --extras "llm"       + Anthropic LLM summarizer only
#   poetry install --extras "viz"       + Streamlit/PyVis visualizer only
#   poetry install --all-extras --with dev,kg    full maintainer environment
#
# First-time setup
# ----------------
#   poetry install --with dev
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=agent_kg           with coverage
#
# Build KG indices (after code changes)
# --------------------------------------
#   pycodekg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agent_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "agent-kg"
version = "0.8.2"
description = "Conversational memory as a knowledge graph"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "conversation-memory", "sqlite-vec", "mcp", "semantic-search", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    "kgmodule-utils[semantic,sqlite-vec]>=0.13.2",
    # Capped at <2: mcp 2.0 removed the low-level Server decorator API
    # (@app.list_tools / @app.call_tool) that agent_kg.mcp.server registers on.
    "mcp>=1.0.0,<2",
    "numpy>=1.24.0",
    "rich>=14.0.0",
    "safetensors>=0.5.0",
    "sentence-transformers>=5.2.0",
    "spacy>=3.7.0",
    "torch>=2.5.1",
    "transformers>=5.5.0,<6",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.25.0",
]
# Local / cloud summarization backends (omlx, ollama, openai) via the shared
# kg_utils.synthesis TextSynthesizer, which drives all three over the OpenAI
# wire protocol (the text subset of kgmodule-utils' "synthesis" extra).
local = [
    "openai>=1.30.0",
]
viz = [
    "pyvis>=0.3.2",
    "streamlit>=1.35.0",
]
# Cross-KG siblings are never imported by this package, so none are extras --
# listing them would put sibling packages into the published dependency graph.
# The two whose CLIs this repo actually runs (doc-kg, pycode-kg) live in
# [tool.poetry.group.kg] below. kg-rag is neither imported nor run here.

# An `all` aggregate extra used to sit here. Alongside the feature packages it
# re-listed every dev tool by name, so the wheel advertised them as installable
# regardless of where the dev dependencies themselves lived — the defect that
# survived doc_kg's and Metabo_kg's group migrations, and one the manifest
# cannot show you. Retired: ask for `[llm,local,viz]`.

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
ty = ">=0.0.44"
pdoc = ">=14.0.0"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0,<0.16"

# ---------------------------------------------------------------------------
# Maintainer tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# doc-kg and pycode-kg are tools this repo *runs*, not libraries it imports.
# Nothing under src/ imports either one. They are here because:
#   - the local .git/hooks/pre-commit rebuilds both indices before committing
#     (it probes .venv/bin/pycodekg and .venv/bin/dockg first, so an installed
#     group is exactly what it wants to find),
#   - .claude/commands/release.md runs `pycodekg build` as a release step,
#   - .mcp.json serves a `dockg` MCP server.
# Undeclared, all three silently degrade on a fresh clone.
#
# A Poetry group rather than [project.optional-dependencies] on purpose. Groups
# are maintainer-facing: locked and installable, but NOT written into the
# wheel's metadata -- so no published extra acquires a sibling package, and the
# KG fleet's dependency resolution stays decoupled.
#
#   poetry install --with kg      # get the dockg / pycodekg CLIs into .venv/bin
#   poetry install                # default: group is optional, skipped
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
doc-kg = ">=0.21.2"
pycode-kg = ">=0.23.1"

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/agent_kg"
Repository = "https://github.com/Flux-Frontiers/agent_kg"

[project.scripts]
agentkg               = "agent_kg.cli.main:cli"
agentkg-analyze       = "agent_kg.cli.main:analyze"
agentkg-assemble      = "agent_kg.cli.main:assemble"
agentkg-init          = "agent_kg.cli.main:init"
agentkg-install-hooks = "agent_kg.cli.main:install_hooks"
agentkg-ingest        = "agent_kg.cli.main:ingest"
agentkg-mcp           = "agent_kg.mcp.server:main"
agentkg-onboard       = "agent_kg.cli.main:onboard"
agentkg-profile       = "agent_kg.cli.main:profile"
agentkg-prune         = "agent_kg.cli.main:prune_cmd"
agentkg-query         = "agent_kg.cli.main:query"
agentkg-sessions      = "agent_kg.cli.main:sessions"
agentkg-snapshot      = "agent_kg.cli.main:snapshot"
agentkg-stats         = "agent_kg.cli.main:stats"
agentkg-viz           = "agent_kg.cli.main:viz"
agentkg-wipe          = "agent_kg.cli.main:wipe"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"
# Honor existing `# type: ignore` / `# ty: ignore` suppressions even when the
# underlying error doesn't fire in a given install (e.g. optional extras absent
# in lean CI), rather than failing the build on a seemingly "unused" ignore.
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies (model, sqlite-vec)",
]

# ---------------------------------------------------------------------------
# PyCodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
include = ["src"]

[tool.dockg]
exclude = [
    ".agentkg", ".dockg", ".pycodekg", ".git", ".mypy_cache", ".pytest_cache", ".venv",
    "__pycache__", "bundles", "dist", "venv",
]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation and user guide PDFs"
sequence = [
    { shell = "cd src && pdoc --o ../docs --logo ./logo.png agent_kg" },
]

[tool.poe.tasks.wiki]
help = "Generate and publish GitHub wiki from docs/"
cmd  = "python scripts/generate_wiki.py"

[tool.poe.tasks.wiki-preview]
help = "Preview wiki generation without publishing"
cmd  = "python scripts/generate_wiki.py --dry-run"
