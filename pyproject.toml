# pyproject.toml — AgentKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
# Last Revision: 2026-07-29 11:17:01
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Quick install (pip)
# -------------------
#   pip install -e ".[dev]"             core + dev tools (pytest, ruff, ty, etc.)
#   pip install -e ".[llm]"             core + Anthropic LLM summarizer
#   pip install -e ".[viz]"             core + Streamlit/PyVis visualizer
#   pip install -e ".[all]"             everything above
#   pip install -e "."                  core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install --all-extras         everything
#   poetry install --extras "dev"       core + dev tools only
#   poetry install --extras "llm"       core + Anthropic LLM summarizer only
#   poetry install --extras "viz"       core + Streamlit/PyVis visualizer only
#   poetry install                      core runtime only
#
# First-time setup
# ----------------
#   python -m venv .venv
#   source .venv/bin/activate       # Windows: .venv\Scripts\activate
#   pip install -e ".[dev]"
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=agent_kg           with coverage
#
# Build KG indices (after code changes)
# --------------------------------------
#   pycodekg build --repo .

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agent_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "agent-kg"
version = "0.8.0"
description = "Conversational memory as a knowledge graph"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "conversation-memory", "sqlite-vec", "mcp", "semantic-search", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    "kgmodule-utils[semantic,sqlite-vec]>=0.8.0",
    "mcp>=1.0.0",
    "numpy>=1.24.0",
    "rich>=14.0.0",
    "safetensors>=0.5.0",
    "sentence-transformers>=5.2.0",
    "spacy>=3.7.0",
    "torch>=2.5.1",
    "transformers>=5.5.0,<6",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5.0",
    "ty>=0.0.41",
    "pdoc>=14.0.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
llm = [
    "anthropic>=0.25.0",
]
# Local / cloud summarization backends (omlx, ollama, openai) via the shared
# kg_utils.synthesis TextSynthesizer, which drives all three over the OpenAI
# wire protocol (the text subset of kgmodule-utils' "synthesis" extra).
local = [
    "openai>=1.30.0",
]
viz = [
    "pyvis>=0.3.2",
    "streamlit>=1.35.0",
]
# Cross-KG sibling packages (doc-kg, pycode-kg, kg-rag) are NOT declared here.
# They are never imported by this package, and listing them forces poetry's
# universal resolution to reconcile the transformers pin of every *published*
# sibling against this project's own -- a deadlock, since doc-kg and pycode-kg
# each depend on the other. Install them by hand:
#   pip install doc-kg pycode-kg          # both on PyPI
all = [
    "anthropic>=0.25.0",
    "detect-secrets>=1.5.0",
    "openai>=1.30.0",
    "ty>=0.0.41",
    "pdoc>=14.0.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyvis>=0.3.2",
    "ruff>=0.4.0",
    "streamlit>=1.35.0",
]

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/agent_kg"
Repository = "https://github.com/Flux-Frontiers/agent_kg"

[project.scripts]
agentkg               = "agent_kg.cli.main:cli"
agentkg-analyze       = "agent_kg.cli.main:analyze"
agentkg-assemble      = "agent_kg.cli.main:assemble"
agentkg-init          = "agent_kg.cli.main:init"
agentkg-install-hooks = "agent_kg.cli.main:install_hooks"
agentkg-ingest        = "agent_kg.cli.main:ingest"
agentkg-mcp           = "agent_kg.mcp.server:main"
agentkg-onboard       = "agent_kg.cli.main:onboard"
agentkg-profile       = "agent_kg.cli.main:profile"
agentkg-prune         = "agent_kg.cli.main:prune_cmd"
agentkg-query         = "agent_kg.cli.main:query"
agentkg-sessions      = "agent_kg.cli.main:sessions"
agentkg-snapshot      = "agent_kg.cli.main:snapshot"
agentkg-stats         = "agent_kg.cli.main:stats"
agentkg-viz           = "agent_kg.cli.main:viz"
agentkg-wipe          = "agent_kg.cli.main:wipe"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"
# Honor existing `# type: ignore` / `# ty: ignore` suppressions even when the
# underlying error doesn't fire in a given install (e.g. optional extras absent
# in lean CI), rather than failing the build on a seemingly "unused" ignore.
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-v --tb=short"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests that exercise real external dependencies (model, sqlite-vec)",
]

# ---------------------------------------------------------------------------
# PyCodeKG / DocKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
include = ["src"]

[tool.dockg]
exclude = [
    ".agentkg", ".dockg", ".pycodekg", ".git", ".mypy_cache", ".pytest_cache", ".venv",
    "__pycache__", "bundles", "dist", "venv",
]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation and user guide PDFs"
sequence = [
    { shell = "cd src && pdoc --o ../docs --logo ./logo.png agent_kg" },
]

[tool.poe.tasks.wiki]
help = "Generate and publish GitHub wiki from docs/"
cmd  = "python scripts/generate_wiki.py"

[tool.poe.tasks.wiki-preview]
help = "Preview wiki generation without publishing"
cmd  = "python scripts/generate_wiki.py --dry-run"
